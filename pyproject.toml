[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tex2word"
version = "1.0.0"
description = "Convert PDF, TeX, and Markdown documents to Microsoft Word (.docx) with native editable MathType equations on Windows."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
keywords = ["pdf", "latex", "tex", "markdown", "word", "docx", "mathtype", "windows", "ocr"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "pypandoc-binary==1.17",
    "python-docx>=1.2,<2",
    "lxml>=5,<7",
    "pywin32>=308",
    "olefile==0.47",
    "rapid-doc[cpu]==0.9.12",
]

[project.urls]
Homepage = "https://github.com/Swk6666/TeX2Word"
Repository = "https://github.com/Swk6666/TeX2Word"
Issues = "https://github.com/Swk6666/TeX2Word/issues"

[project.scripts]
tex2word = "tex2word.__main__:main"

[project.gui-scripts]
tex2word-gui = "tex2word.gui:run"

[tool.setuptools.packages.find]
include = ["tex2word*"]
