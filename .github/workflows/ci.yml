name: CI (Windows)

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-and-build-desktop:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Windows Fluent WPF desktop app and CLI entry point
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $wpf = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\WPF"
          New-Item -ItemType Directory -Force -Path build_ci | Out-Null
          & $csc /nologo /warnaserror+ /target:winexe /platform:x64 /codepage:65001 /optimize+ `
            "/r:$wpf\PresentationFramework.dll" "/r:$wpf\PresentationCore.dll" `
            "/r:$wpf\WindowsBase.dll" /r:System.Xaml.dll `
            "/resource:desktop\MainWindow.xaml,TeX2Word.MainWindow.xaml" `
            "/out:build_ci\TeX2Word.exe" "/win32icon:desktop\TeX2Word.ico" "/win32manifest:desktop\app.manifest" `
            desktop\Program.cs desktop\Conversion.cs desktop\CliRunner.cs desktop\ShellDialogs.cs desktop\Theme.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $csc /nologo /warnaserror+ /target:exe /platform:x64 /codepage:65001 /optimize+ `
            "/out:build_ci\TeX2Word.com" "/win32icon:desktop\TeX2Word.ico" `
            desktop\Cli.cs desktop\CliRunner.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
